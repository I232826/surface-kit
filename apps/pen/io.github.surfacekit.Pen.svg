<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f5f4"/>
      <stop offset="1" stop-color="#c0bfbc"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <!-- a stroke drawn by the pen -->
  <path d="M26 96 C 40 82, 52 104, 66 90" fill="none" stroke="#ffffff" stroke-width="5"
        stroke-linecap="round" opacity="0.9"/>
  <!-- the pen, at 45 degrees: top button, body, tip -->
  <g transform="rotate(45 64 64)">
    <rect x="56" y="10" width="16" height="12" rx="6" fill="#3d3846"/>
    <rect x="56" y="20" width="16" height="64" rx="3" fill="url(#body)"/>
    <rect x="72" y="40" width="3" height="14" rx="1.5" fill="#3d3846"/>
    <path d="M56 84 L72 84 L66 100 L62 100 Z" fill="#9a9996"/>
    <path d="M62 100 L66 100 L64 106 Z" fill="#3d3846"/>
  </g>
</svg>
