# Surface Pro 7 (surface-kit). Installed by camera/install/install.sh to
# /etc/dracut.conf.d/surface-kit.conf.
#
# soc_button_array (power and volume buttons) skips GPIOs whose controller
# isn't there yet and then gives up on the device for good: with the Ice
# Lake pin controller probing after it, the power button is gone until the
# device is bound again. Load the controller first, and the patched
# gpio_keys with it.
force_drivers+=" pinctrl_icelake gpio_keys "
