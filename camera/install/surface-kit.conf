# Surface Pro 7 (surface-kit). Installed by camera/install/install.sh.

# --- cameras

# Only surface-camera.service may load the IPU, after switching its IOMMU
# group to passthrough; auto-loading it before that freezes the machine.
blacklist intel-ipu4p
blacklist intel-ipu4p-isys
blacklist intel-ipu4p-psys

options intel-ipu4p fw_version_check=0
# Front ov5693 (CSI-2 port 2) locks reliably with the shifted data-lane timing
# the Windows driver uses (patch 0016: 24/24 clean starts vs 4/24).
# skip_fw_ports=6: leave the never-probing IR ov7251 out of the notifier so it
# completes and the rear lens gets a node (0011).
options intel-ipu4p-isys csi2_shifted_ticks_port=-1,-1,1269 skip_fw_ports=6

# Front camera mirrored like a selfie view (patches/ov5693/0001)
options ov5693 mirror=1

# --- power button
# Waking with the power button must not count as a press, or GNOME suspends
# again right away (patches/gpio_keys/0001; the Surface button is gpio-keys).
options gpio_keys wake_key_press=0 resume_ignore_ms=1500
# The buttons' driver gives up for good (silently) if it probes before the
# GPIO controller's: load that first. dracut-surface-kit.conf does the same
# in the initramfs.
softdep soc_button_array pre: pinctrl_icelake

# --- audio
# The ALC274 is powered down after 1 s of silence by default, and the
# speakers then sometimes stay silent when sound starts again: keep it up.
options snd_hda_intel power_save=0
