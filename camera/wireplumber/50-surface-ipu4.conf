# Surface Pro 7 (IPU4P): don't let WirePlumber's V4L2 monitor open the ~50
# raw capture nodes the isys exposes. Concurrent opens wreck captures, and
# none of them is usable by apps directly; cameras reach apps through
# libcamera (simple pipeline + software ISP) instead.
#
# Install: ~/.config/wireplumber/wireplumber.conf.d/
#          then: systemctl --user restart wireplumber
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
  }
}
