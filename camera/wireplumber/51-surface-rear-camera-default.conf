# Surface Pro 7: make the rear camera (ov8865) the default camera. WirePlumber
# ranks the front one higher (800 vs 750), but the front ov5693 is parked:
# its link locks only now and then (camera/README.md). Apps that just open
# "the camera" (browsers, chat apps) get the rear one; the front one stays
# selectable.
#
# Install: ~/.config/wireplumber/wireplumber.conf.d/
#          then: systemctl --user restart wireplumber
monitor.libcamera.rules = [
  {
    matches = [
      { node.name = "libcamera_input.__SB_.PCI0.I2C3.CAMR" }
    ]
    actions = {
      update-props = {
        priority.session = 1000
      }
    }
  }
]
