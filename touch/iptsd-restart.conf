# Drop-in for iptsd@.service (install to /etc/systemd/system/iptsd@.service.d/).
#
# On every resume from s2idle the IPTS touch device is re-created and udev
# starts a fresh iptsd for it. When that start races the touch controller
# waking up, iptsd exits with "IOCTL ... failed: Input/output error" and,
# without a restart rule, touch stays dead until the next suspend happens to
# re-trigger it. Retry instead.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=10

[Service]
Restart=on-failure
RestartSec=2
