# iptsd settings for the Surface Pro 7 (surface-kit), installed by
# touch/install.sh to /etc/iptsd.d/90-surface-pro-7.conf. iptsd ships no
# preset for this model and its defaults break touch up:
#
# - A sliding fingertip covers only 1-2 cells of this coarse touch grid;
#   after iptsd blurs the heatmap its peak drops below the default
#   ActivationThreshold of 24 in about half the frames, and every missed
#   frame ends the touch (measured: 47% of stroke frames lost, 89 of 92
#   touches under 50 ms, so scrolling and pinching fell apart). At 16 no
#   frame is lost and no extra contacts appear (replayed with iptsd-plot on
#   a recording; vendor/touch-strokes.bin).
# - Finger size from iptsd-calibrate: 0.92-2.12 cm, aspect up to 2.36; the
#   default SizeMax of 2.0 cm rejected larger fingertips.

[Touchscreen]
# no touch while the pen is in range, and none at all while a palm rests
DisableOnStylus = true
DisableOnPalm = true

[Contacts]
ActivationThreshold = 16
DeactivationThreshold = 12
SizeMin = 0.8
SizeMax = 2.3
AspectMin = 1.0
AspectMax = 2.4
